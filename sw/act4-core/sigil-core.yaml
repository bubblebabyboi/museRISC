# yaml-language-server: $schema=https://raw.githubusercontent.com/riscv/riscv-unified-db/main/spec/schemas/config_schema.json
---
# UDB architecture configuration for the Sigil in-house RV64
# core (issue #18), as of stage 4a (RV64IMA, M/S/U, Sv39+Svnapot,
# PMP16). DUT: rtl/core/sigil_core.sv and friends running in
# the C++ Verilator harness (tb/cpp/core_tb.cpp ELF/HTIF mode,
# paged physical memory, boot_pc_i = ELF entry at 0x8000_0000).
# Every value below was read out of the RTL in this repository
# (citations name the file); the layout follows
# sw/act4-cva6/sigil-cv64a6.yaml. Declared for the stage-3d
# I,M suites first; privileged suites are generated too
# (test_config include_priv_tests) and reported separately.
# One known deliberate imperfection, invisible to I/M but
# recorded here so priv results are read honestly:
# - Misaligned-vs-page-fault priority is misaligned-first
#   (detected in EX, translation in MEM); the param below keeps
#   the CVA6 value until a priv suite discriminates it.
$schema: config_schema.json#
kind: architecture configuration
type: fully configured
name: sigil-core
description: Sigil in-house RV64IM core (5-stage, Sv39) in the C++ Verilator harness

implemented_extensions:
  # misa is a read mux constant (writes WARL-ignored):
  # rtl/core/sigil_csr.sv "12'h301: csr_rdata =
  # 64'h8000_0000_0034_11AF"  (MXL=2, I, M, A, F, D, C, B, H, V, S, U).
  - { name: I, version: "= 2.1" }
  - { name: M, version: "= 2.0" }
  # A via MEM-stage RMW on the combinational memory port
  # (sigil_core.sv amo_result + reservation registers).
  - { name: A, version: "= 2.1.0" }
  - { name: Zaamo, version: "= 1.0.0" }
  - { name: Zalrsc, version: "= 1.0.0" }
  - { name: Zmmul, version: "= 1.0.0" }
  # F/D via rtl/core/sigil_fpu.sv (combinational IEEE-754,
  # SoftFloat-checked in tb/cpp/fpu_tb.cpp); fcsr/frm/fflags
  # in sigil_csr.sv, mstatus.FS writable + dirty-tracked.
  - { name: F, version: "= 2.2.0" }
  - { name: D, version: "= 2.2.0" }
  # B + Zicond + scalar crypto via rtl/core/sigil_bext.sv
  # (golden-checked in tb/cpp/bext_tb.cpp, AES-128 KAT in
  # sw/core-tests/bext_directed.S). misa.B is set.
  - { name: B, version: "= 1.0.0" }
  - { name: Zba, version: "= 1.0.0" }
  - { name: Zbb, version: "= 1.0.0" }
  - { name: Zbc, version: "= 1.0.0" }
  - { name: Zbs, version: "= 1.0.0" }
  - { name: Zicond, version: "= 1.0.0" }
  - { name: Zbkb, version: "= 1.0.0" }
  - { name: Zbkc, version: "= 1.0.0" }
  - { name: Zbkx, version: "= 1.0.0" }
  - { name: Zkne, version: "= 1.0.1" }
  # C via rtl/core/sigil_rvc.sv decompressor + fetch
  # realigner in sigil_core.sv (IALIGN=16).
  - { name: C, version: "= 2.0" }
  - { name: Zca, version: "= 1.0.0" }
  - { name: Zcb, version: "= 1.0.0" }
  - { name: Zcd, version: "= 1.0.0" }
  - { name: Zknd, version: "= 1.0.1" }
  # Integer vector (stage 8, issue #23): combinational RVV
  # 1.0 integer unit (rtl/core/sigil_vec.sv) + MEM-stage
  # element sequencer for all load/store classes in
  # sigil_core.sv; VLEN=512, ELEN=64 (see params below).
  # FP vector (stage 9, issue #29): the OPF classes execute
  # per element through the shared scalar fp_eval in
  # sigil_fpu_pkg.sv from sigil_vec.sv, so the Vf*
  # suites are generated. Full V is not declared yet.
  - { name: Zve32x, version: "= 1.0.0" }
  - { name: Zve64x, version: "= 1.0.0" }
  - { name: Zve32f, version: "= 1.0.0" }
  - { name: Zve64f, version: "= 1.0.0" }
  - { name: Zve64d, version: "= 1.0.0" }
  - { name: Zvl32b, version: "= 1.0.0" }
  - { name: Zvl64b, version: "= 1.0.0" }
  - { name: Zvl128b, version: "= 1.0.0" }
  - { name: Zvl256b, version: "= 1.0.0" }
  - { name: Zvl512b, version: "= 1.0.0" }
  - { name: Zknh, version: "= 1.0.1" }
  - { name: Zicsr, version: "= 2.0" }
  - { name: Zifencei, version: "= 2.0.0" }
  # H via sigil_csr.sv (HS/VS CSR banks, two-level traps),
  # sigil_mmu.sv (Sv39 + Sv39x4 two-stage translation), and
  # HLV/HSV/HLVX/HFENCE in the decoder/core. GEILEN=0. The
  # pinned ACT tree ships no H suite yet, so H evidence comes
  # from the first-party CSR/MMU TBs, hyp_directed.S, and the
  # Linux KVM smoke (issue #22).
  - { name: H, version: "= 1.0.0" }

  # cycle/time/instret all readable; time mirrors cycle
  # (sigil_csr.sv read cases 0xC00/0xC01/0xC02), gated by
  # mcounteren/scounteren below M.
  - { name: Zicntr, version: "= 2.0" }

  # Fetch and page-table walks read the same coherent harness
  # memory as data (no caches at all in this core).
  - { name: Ziccif, version: "= 1.0.0" }
  - { name: Ssccptr, version: "= 1.0.0" }

  # M/S/U implemented (sigil_csr.sv priv_q + trap logic).
  - { name: U, version: "= 1.0.0" }
  - { name: S, version: "= 1.12.0" }
  # Sm 1.12: menvcfg (0x30A) and mconfigptr (0xF15) both decode.
  - { name: Sm, version: "= 1.12.0" }

  # satp MODE is WARL-clamped to Bare (0) or Sv39 (8) on write
  # (sigil_csr.sv case 0x180).
  - { name: Sv39, version: "= 1.0.0" }
  - { name: Svbare, version: "= 1.0.0" }
  # Svnapot 64K leaves translate (sigil_mmu.sv, N-bit path).
  - { name: Svnapot, version: "= 1.0.0" }
  # Svadu: the walker writes A/D back to the PTE in memory
  # (sigil_mmu.sv W_UPD state); it never faults for A/D.
  - { name: Svadu, version: "= 1.0.0" }

  # stval/mtval always carry the faulting address (core wires
  # VA through to trap_tval_i); stvec has direct+vectored.
  - { name: Sstvala, version: "= 1.0.0" }
  - { name: Sstvecd, version: "= 1.0.0" }
  # (Sscounterenw is not claimed: UDB requires Zihpm, whose
  # unprivileged counter shadows this core does not provide.)
  # UXL is hardwired 2 (64-bit) in mstatus assembly.
  - { name: Ssu64xl, version: "= 1.0.0" }

  # Not implemented and deliberately absent: full V (the
  # Zve*f/d subsets above are implemented; full V awaits
  # its own evidence), Zihpm
  # (mhpmcounter3..31 decode as zero in M, their unprivileged
  # shadows trap, so the Zihpm contract is not met),
  # Svinval, Svpbmt, Sstc, Sdtrig, Zicbo*.

params:
  # Reservation covers exactly the LR access (4 or 8 bytes);
  # misaligned AMO/LR/SC trap like other accesses.
  LRSC_RESERVATION_STRATEGY: "reserve exactly enough to cover the access"
  MISALIGNED_AMO: false
  LRSC_MISALIGNED_BEHAVIOR: "always raise misaligned exception"
  # Reservation is tracked on physical addresses, so an SC
  # through a synonym VA succeeds; an SC smaller than the LR
  # but inside its range also succeeds (not exact-match only).
  LRSC_FAIL_ON_VA_SYNONYM: false
  LRSC_FAIL_ON_NON_EXACT_LRSC: false
  NON_STANDARD_EXTENSION_IMPLEMENTED: false
  # misa writes are ignored, so no misa bit is mutable.
  MUTABLE_MISA_A: false
  MUTABLE_MISA_M: false
  MUTABLE_MISA_U: false
  MUTABLE_MISA_S: false
  # FS fully writable, Dirty on FP-register writes (precise).
  MSTATUS_FS_LEGAL_VALUES: [0, 1, 2, 3]
  MUTABLE_MISA_F: false
  MUTABLE_MISA_D: false
  MUTABLE_MISA_B: false
  MUTABLE_MISA_C: false
  # Hardware sets FS to Dirty whenever an FP register is
  # written (sigil_core.sv fp_dirty).
  HW_MSTATUS_FS_DIRTY_UPDATE: precise
  MSTATUS_VS_LEGAL_VALUES: [0, 1, 2, 3]
  # The time CSR (0xC01) is readable (mirrors cycle).
  TIME_CSR_IMPLEMENTED: true

  # ---------------------------------------------------------------- U params
  U_MODE_ENDIANNESS: little
  # WFI is a NOP in every mode unless TW traps it
  # (sigil_csr.sv sys_illegal case 3), so U-mode WFI is legal.
  WFI_U_MODE: true
  UXLEN: [64]
  TRAP_ON_ECALL_FROM_U: true

  # ---------------------------------------------------------------- S params
  # satp stores the full 16-bit ASID field unmasked.
  ASID_WIDTH: 16
  S_MODE_ENDIANNESS: little
  # SSIP/STIP/SEIP exist in mip/mie/mideleg (software bits plus
  # irq_s_timer_i / irq_s_ext_i pins, tied low unless the
  # directed harness drives them).
  SEI_INTR_IMPL: true
  SSI_INTR_IMPL: true
  STI_INTR_IMPL: true
  SXLEN: [64]
  REPORT_VA_IN_MTVAL_ON_LOAD_PAGE_FAULT: true
  REPORT_VA_IN_MTVAL_ON_STORE_AMO_PAGE_FAULT: true
  REPORT_VA_IN_MTVAL_ON_INSTRUCTION_PAGE_FAULT: true
  REPORT_VA_IN_STVAL_ON_BREAKPOINT: true
  REPORT_VA_IN_STVAL_ON_LOAD_MISALIGNED: true
  REPORT_VA_IN_STVAL_ON_STORE_AMO_MISALIGNED: true
  REPORT_VA_IN_STVAL_ON_INSTRUCTION_MISALIGNED: true
  REPORT_VA_IN_STVAL_ON_LOAD_ACCESS_FAULT: true
  REPORT_VA_IN_STVAL_ON_STORE_AMO_ACCESS_FAULT: true
  REPORT_VA_IN_STVAL_ON_INSTRUCTION_ACCESS_FAULT: true
  REPORT_VA_IN_STVAL_ON_LOAD_PAGE_FAULT: true
  REPORT_VA_IN_STVAL_ON_STORE_AMO_PAGE_FAULT: true
  REPORT_VA_IN_STVAL_ON_INSTRUCTION_PAGE_FAULT: true
  # Illegal instructions always write the encoding to tval
  # (ID for decode-illegal, EX for CSR/sys via idex_instr_q).
  REPORT_ENCODING_IN_STVAL_ON_ILLEGAL_INSTRUCTION: true
  STVAL_WIDTH: 64
  # scounteren write mask is CY|TM|IR (sigil_csr.sv 0x106).
  SCOUNTENABLE_EN:
    [
      true, true, true, false, false, false, false, false,
      false, false, false, false, false, false, false, false,
      false, false, false, false, false, false, false, false,
      false, false, false, false, false, false, false, false,
    ]
  # stvec/mtvec: {base[63:2], mode} with modes 2/3 mapped to 0;
  # vectored target is base + 4*cause, so 4-byte alignment is
  # all the base needs.
  STVEC_MODES: [0, 1]
  STVEC_BASE_ALIGNMENT_VECTORED: 4
  SATP_MODE_BARE: true
  TRAP_ON_ECALL_FROM_S: true

  # ---------------------------------------------------------------- Sm params
  # ACT reads these as "the platform can raise it via rvmodel
  # macros"; the harness has no CLINT/PLIC devices for ACT
  # ELFs to poke, so all three are false here even though the
  # core's mie/mip bits and pins implement them.
  MEI_INTR_IMPL: false
  MSI_INTR_IMPL: false
  MTI_INTR_IMPL: false
  # WFI never waits (NOP), so it always resumes immediately.
  WFI_FINITE: true
  MXLEN: 64
  PRECISE_SYNCHRONOUS_EXCEPTIONS: true
  TRAP_ON_ECALL_FROM_M: true
  TRAP_ON_EBREAK: true
  # mvendorid reads 0; marchid = "SIGL" (0x5349474C), mimpid
  # = 0x00030000 (stage 3), mconfigptr = 0
  # (sigil_csr.sv read cases 0xF11-0xF15).
  MARCHID_IMPLEMENTED: true
  ARCH_ID_VALUE: 1297246277
  MIMPID_IMPLEMENTED: true
  IMP_ID_VALUE: 196608
  VENDOR_ID_BANK: 0
  VENDOR_ID_OFFSET: 0
  CONFIG_PTR_ADDRESS: 0
  # Misaligned scalar loads/stores trap (EX alignment check);
  # no Zicclsm. Priority value kept from the CVA6 config for
  # now; ours is detected before translation (see header).
  MISALIGNED_LDST: false
  MISALIGNED_LDST_EXCEPTION_PRIORITY: low
  TRAP_ON_ILLEGAL_WLRL: false
  TRAP_ON_UNIMPLEMENTED_INSTRUCTION: true
  TRAP_ON_RESERVED_INSTRUCTION: true
  TRAP_ON_UNIMPLEMENTED_CSR: true
  REPORT_VA_IN_MTVAL_ON_BREAKPOINT: true
  REPORT_VA_IN_MTVAL_ON_LOAD_MISALIGNED: true
  REPORT_VA_IN_MTVAL_ON_STORE_AMO_MISALIGNED: true
  REPORT_VA_IN_MTVAL_ON_INSTRUCTION_MISALIGNED: true
  REPORT_VA_IN_MTVAL_ON_LOAD_ACCESS_FAULT: true
  REPORT_VA_IN_MTVAL_ON_STORE_AMO_ACCESS_FAULT: true
  REPORT_VA_IN_MTVAL_ON_INSTRUCTION_ACCESS_FAULT: true
  REPORT_ENCODING_IN_MTVAL_ON_ILLEGAL_INSTRUCTION: true
  MTVAL_WIDTH: 64
  PMA_GRANULARITY: 12
  # Addresses are 56-bit physical (Sv39 PPN + PMP domain).
  PHYS_ADDR_WIDTH: 56
  M_MODE_ENDIANNESS: little
  MISA_CSR_IMPLEMENTED: true
  MTVEC_ACCESS: rw
  MTVEC_MODES: [0, 1]
  MTVEC_BASE_ALIGNMENT_DIRECT: 4
  MTVEC_BASE_ALIGNMENT_VECTORED: 4
  # Writes of mode 2/3 land as mode 0 (WARL ternary in the
  # mtvec/stvec write cases), not retained and not ignored.
  MTVEC_ILLEGAL_WRITE_BEHAVIOR: custom
  # PMP: 16 entries, all usable, 4-byte grain (UDB granularity
  # is log2 of the grain in bytes), OFF/TOR/NA4/NAPOT all
  # decode (sigil_csr.sv pmp_match).
  NUM_PMP_ENTRIES: 16
  PMP_GRANULARITY: 2
  NUM_USABLE_PMP_ENTRIES: 16
  PMP_NA4_SUPPORTED: true
  PMP_NAPOT_SUPPORTED: true
  PMP_TOR_SUPPORTED: true
  # No HPM counters count: mhpmcounter3..31 read zero in M.
  HPM_COUNTER_EN:
    [
      false, false, false, false, false, false, false, false,
      false, false, false, false, false, false, false, false,
      false, false, false, false, false, false, false, false,
      false, false, false, false, false, false, false, false,
    ]
  MCOUNTINHIBIT_IMPLEMENTED: true
  # mcountinhibit write mask is CY|IR (0x320 case).
  COUNTINHIBIT_EN:
    [
      true, false, true, false, false, false, false, false,
      false, false, false, false, false, false, false, false,
      false, false, false, false, false, false, false, false,
      false, false, false, false, false, false, false, false,
    ]
  # mcounteren write mask is CY|TM|IR (0x306 case).
  MCOUNTENABLE_EN:
    [
      true, true, true, false, false, false, false, false,
      false, false, false, false, false, false, false, false,
      false, false, false, false, false, false, false, false,
      false, false, false, false, false, false, false, false,
    ]

  # ------------------------------------------------------ Vector (stage 8)
  # VLEN=512 (vlenb=64), ELEN=64: rtl/core/sigil_vregfile.sv
  # (32 x 512-bit registers), vlenb CSR in sigil_csr.sv.
  VLEN: 512
  ELEN: 64
  SEW_MIN: 8
  # mstatus.VS is a plain 2-bit state register in each of the
  # M/HS/VS views (mstatus_vs_q / vs_vs_q in sigil_csr.sv),
  # software-writable to all encodings; a committing vector
  # register write or vset raises it to Dirty in EX.
  HW_MSTATUS_VS_DIRTY_UPDATE: precise
  # vsstatus exists (H extension, stage 7) with its own VS.
  VSSTATUS_VS_EXISTS: true
  VSXLEN: [64]
  VUXLEN: [64]
  VSTVEC_MODES: [0, 1]

  # ---------------------------------- H params (required since VSXLEN)
  # hgatp/vsatp Bare modes are supported (sigil_mmu.sv
  # mode decode); invalid vsatp MODE writes when V=0 are
  # WARL-ignored like other satp writes.
  GSTAGE_MODE_BARE: true
  VSSTAGE_MODE_BARE: true
  IGNORE_INVALID_VSATP_MODE_WRITES_WHEN_V_EQ_ZERO: true
  MUTABLE_MISA_H: false
  # GEILEN = 0 (hgeie/hgeip reads zero, sigil_csr.sv).
  NUM_EXTERNAL_GUEST_INTERRUPTS: 0
  VMID_WIDTH: 14
  # htinst is always written 0 (trap_tinst_i tied to 0 in
  # sigil_core.sv, a legal choice).
  TINST_VALUE_ON_MCALL: "always zero"
  TINST_VALUE_ON_SCALL: "always zero"
  TINST_VALUE_ON_STORE_AMO_ACCESS_FAULT: "always zero"
  TINST_VALUE_ON_STORE_AMO_ADDRESS_MISALIGNED: "always zero"
  TINST_VALUE_ON_STORE_AMO_PAGE_FAULT: "always zero"
  TINST_VALUE_ON_UCALL: "always zero"
  TINST_VALUE_ON_VIRTUAL_INSTRUCTION: "always zero"
  TINST_VALUE_ON_VSCALL: "always zero"
  TRAP_ON_ECALL_FROM_VS: true
  # hvip-injected VS interrupts (stage 7d); no guest
  # external interrupt files (GEILEN = 0).
  VSEI_INTR_IMPL: false
  VSSI_INTR_IMPL: false
  VSTI_INTR_IMPL: true
  VS_MODE_ENDIANNESS: little
  VU_MODE_ENDIANNESS: little
  # Trap reporting: VA in vstval, GPA in htval (stage 7
  # two-stage fault path in sigil_core/mmu), Sv39-only.
  REPORT_GPA_IN_TVAL_ON_LOAD_GUEST_PAGE_FAULT: true
  REPORT_GPA_IN_TVAL_ON_STORE_AMO_GUEST_PAGE_FAULT: true
  REPORT_VA_IN_VSTVAL_ON_BREAKPOINT: true
  REPORT_VA_IN_VSTVAL_ON_INSTRUCTION_ACCESS_FAULT: true
  REPORT_VA_IN_VSTVAL_ON_INSTRUCTION_MISALIGNED: true
  REPORT_VA_IN_VSTVAL_ON_INSTRUCTION_PAGE_FAULT: true
  REPORT_ENCODING_IN_VSTVAL_ON_ILLEGAL_INSTRUCTION: true
  REPORT_ENCODING_IN_VSTVAL_ON_VIRTUAL_INSTRUCTION: true
  REPORT_GPA_IN_HTVAL_ON_GUEST_PAGE_FAULT: true
  REPORT_GPA_IN_TVAL_ON_INSTRUCTION_GUEST_PAGE_FAULT: true
  REPORT_GPA_IN_TVAL_ON_INTERMEDIATE_GUEST_PAGE_FAULT: true
  REPORT_VA_IN_VSTVAL_ON_LOAD_ACCESS_FAULT: true
  REPORT_VA_IN_VSTVAL_ON_LOAD_MISALIGNED: true
  REPORT_VA_IN_VSTVAL_ON_LOAD_PAGE_FAULT: true
  REPORT_VA_IN_VSTVAL_ON_STORE_AMO_ACCESS_FAULT: true
  REPORT_VA_IN_VSTVAL_ON_STORE_AMO_MISALIGNED: true
  REPORT_VA_IN_VSTVAL_ON_STORE_AMO_PAGE_FAULT: true
  SV39X4_TRANSLATION: true
  SV39_VSMODE_TRANSLATION: true
  SV48X4_TRANSLATION: false
  SV48_VSMODE_TRANSLATION: false
  SV57X4_TRANSLATION: false
  SV57_VSMODE_TRANSLATION: false
  TINST_VALUE_ON_BREAKPOINT: "always zero"
  TINST_VALUE_ON_FINAL_INSTRUCTION_GUEST_PAGE_FAULT: "always zero"
  TINST_VALUE_ON_FINAL_LOAD_GUEST_PAGE_FAULT: "always zero"
  TINST_VALUE_ON_FINAL_STORE_AMO_GUEST_PAGE_FAULT: "always zero"
  TINST_VALUE_ON_INSTRUCTION_ADDRESS_MISALIGNED: "always zero"
  TINST_VALUE_ON_LOAD_ACCESS_FAULT: "always zero"
  TINST_VALUE_ON_LOAD_ADDRESS_MISALIGNED: "always zero"
  TINST_VALUE_ON_LOAD_PAGE_FAULT: "always zero"
  # hcounteren writable bits are CY/TM/IR only (12'h606).
  HCOUNTENABLE_EN:
    [true, true, true, false, false, false, false, false,
     false, false, false, false, false, false, false, false,
     false, false, false, false, false, false, false, false,
     false, false, false, false, false, false, false, false]
  # FP vector reductions fold sequentially from the vs1
  # seed in sigil_vec.sv; node behavior values mirror the
  # Sail reference configuration.
  VFREDUSUM_FINAL_NODE_ELEMENT_BEHAVIOR: "additive_identity"
  VFREDUSUM_INACTIVE_NODE_ELEMENT_BEHAVIOR: "additive_identity"
  VFREDUSUM_NAN: "no_change"
  VFREDUSUM_NODE_ROUNDING_BEHAVIOR: "SEW_precision"
  # vtype resets with vill=1 (reset branch in sigil_csr.sv).
  FOLLOW_VTYPE_RESET_RECOMMENDATION: true
  # vl = min(AVL, VLMAX) exactly (vset_vl_o computation).
  RVV_VL_WHEN_AVL_LT_DOUBLE_VLMAX: VLMAX
  # All SEW at all fractional LMULs execute (vset_vill only
  # on reserved encodings or SEW > ELEN), which is beyond
  # the required SEW <= LMUL*ELEN set.
  SUPPORT_FRACTIONAL_LMUL_BEYOND_REQUIRED: "custom"
  VILL_SET_ON_RESERVED_VTYPE: true
  # x0/x0 keep-vl form: vill only when the vtype encoding
  # itself is reserved (never for the VLMAX-change case);
  # vl clamps to the new VLMAX (change always applied).
  RESERVED_VSET_X0X0_VILL_SET: "never"
  RESERVED_VSET_X0X0_VLMAX_CHANGE: "always"
  VECTOR_LS_INDEX_MAX_EEW: "XLEN"
  # Element accesses check alignment in MEM and trap
  # (cause 4/6); whole-register transfers are byte accesses.
  VECTOR_LS_MISALIGNED_LEGAL: false
  VECTOR_LS_WHOLEREG_MISALIGNED_LEGAL: true
  VECTOR_LOAD_PAST_TRAP: false
  VECTOR_LS_SEG_PARTIAL_ACCESS: false
  # Fault-only-first trims vl to the faulting element and
  # updates no destination element at or past it.
  VECTOR_FF_UPDATE_PAST_TRIM: "update_none"
  VECTOR_FF_SEG_EXCEPTION_PARTIAL_LOAD: "no_subsegment_loaded"
  VECTOR_LOAD_SEG_FF_OVERWRITE_ELEMENTS_AFTER_FAULT: "no_overwrite"
  VECTOR_FF_NO_EXCEPTION_TRIM: false
  # vstart is an unmasked CSR write target (12'h008).
  LEGAL_VSTART: "1_stride"
  IMPRECISE_VECTOR_TRAP_SETTABLE: false

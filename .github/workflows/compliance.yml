name: ACT4 compliance harness

"on":
  workflow_dispatch:
    inputs:
      extensions:
        description: ACT4 extensions to generate and run on Sail
        required: true
        default: I
        type: string
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read

concurrency:
  group: act4-compliance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  act4-sail:
    name: ACT4 RV64 tests on Sail (harness validation)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXTENSIONS: ${{ inputs.extensions || 'I' }}
      RISCV_TOOLCHAIN_TAG: "2026.08.27"
      RISCV_TOOLCHAIN_ASSET: riscv64-elf-ubuntu-24.04-gcc.tar.xz
    steps:
      - name: Check out Sigil
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y z3 curl git make python3
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Ubuntu 24.04 ships GCC 13, but ACT4 requires GCC 15+. Use the
      # pinned official prebuilt bare-metal toolchain instead.
      - name: Cache RISC-V GCC toolchain
        id: riscv-toolchain-cache
        uses: actions/cache@v4
        with:
          path: ~/riscv-toolchain
          key: riscv-gnu-toolchain-${{ env.RISCV_TOOLCHAIN_TAG }}-${{ env.RISCV_TOOLCHAIN_ASSET }}

      - name: Install RISC-V GCC 15+ toolchain
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.riscv-toolchain-cache.outputs.cache-hit }}" != "true" ]; then
            mkdir -p "$HOME/riscv-toolchain"
            curl -fsSL \
              "https://github.com/riscv-collab/riscv-gnu-toolchain/releases/download/${RISCV_TOOLCHAIN_TAG}/${RISCV_TOOLCHAIN_ASSET}" \
              -o /tmp/riscv-toolchain.tar.xz
            tar -xJf /tmp/riscv-toolchain.tar.xz -C "$HOME/riscv-toolchain"
          fi
          gcc_path=$(find "$HOME/riscv-toolchain" -path '*/bin/riscv64-unknown-elf-gcc' -print -quit)
          test -n "$gcc_path"
          dirname "$gcc_path" >> "$GITHUB_PATH"
          "$gcc_path" --version

      - name: Fetch pinned ACT4 and Sail sources
        run: ./scripts/setup.sh --fetch-act

      - name: Install ACT4 managed tools
        working-directory: third_party/riscv-arch-test
        run: |
          mise trust
          mise install

      - name: Run ACT4 harness on Sail
        shell: bash
        run: |
          set -o pipefail
          make compliance 2>&1 | tee build-ci-act4.log
          summary=third_party/riscv-arch-test/work/sail-RVI20U64/summary.log
          passed=$(grep -c "TEST PASSED" "$summary")
          echo "ACT4 Sail tests passed: $passed" >> "$GITHUB_STEP_SUMMARY"
          if grep -q "TEST FAILED" "$summary"; then
            echo "ACT4 failures found" >&2
            exit 1
          fi
          test "$passed" -gt 0

      - name: Upload ACT4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: act4-sail-${{ github.sha }}
          path: |
            build-ci-act4.log
            third_party/riscv-arch-test/work/sail-RVI20U64/summary.log
          if-no-files-found: warn
          retention-days: 30

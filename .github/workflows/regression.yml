name: RTL regression

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

# Single-threaded Verilator builds (sim/Makefile VJOBS): apt Verilator
# 5.020 intermittently aborts with "attempted to destroy locked Thread
# Pool" when verilating with -j 0.
env:
  VJOBS: "1"

concurrency:
  group: rtl-regression-${{ github.ref }}
  # Cancel superseded runs only for PRs; every commit on main gets a full result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rtl:
    name: Crypto RTL KATs, lint and synthesis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out Sigil
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install simulators and synthesis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator yosys libxml2-utils
          verilator --version
          yosys --version

      - name: Validate shell, Python and SVG sources
        run: |
          bash -n scripts/*.sh
          python3 -m py_compile sw/golden.py sw/ec_ops.py
          xmllint --noout docs/assets/sigil-logo.svg docs/assets/sigil-mark.svg

      - name: Run known-answer regression
        shell: bash
        run: |
          set -o pipefail
          make test 2>&1 | tee build-ci-test.log
          {
            echo "## Sigil RTL regression"
            echo
            grep -E "PASS|EC_OPS|ALL PHASE-0" build-ci-test.log || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Verilator lint
        run: make lint

      - name: Run Yosys synthesis smoke test
        shell: bash
        run: |
          set -o pipefail
          yosys -Q -p "read_verilog -sv rtl/crypto/sha256_block.sv rtl/crypto/sha512_block.sv rtl/crypto/keccak_f1600.sv rtl/crypto/sigil_hash_stream.sv rtl/crypto/ec_field.sv rtl/crypto/sigil_crypto_top.sv; hierarchy -check -top sigil_crypto_top; proc; opt; stat" 2>&1 | tee build-ci-yosys.log

      - name: Upload regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtl-regression-${{ github.sha }}
          path: |
            build-ci-test.log
            build-ci-yosys.log
          if-no-files-found: warn
          retention-days: 30
